<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0e10">
<title>Menzil · Gök</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --bg:#0b0e10;--panel:#10151a;--panel2:#151b20;--line:#212a31;--line2:#2c363e;
  --ink:#e6e9ea;--mute:#8d969c;--dim:#5b646a;--acc:#5fd0e0;--W:#5fd0e0;--E:#ff5a4a;--ok:#7fe0a0;--warn:#e6c35a;--bad:#ff5a4a;
  --cond:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;--sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"IBM Plex Mono",ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink);height:100%;margin:0}
body{font:14px/1.45 var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden}
.shell{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr)}
header.top{display:flex;align-items:center;gap:6px 12px;padding:7px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{font:700 22px/1 var(--cond);letter-spacing:.08em}.brand small{font:600 13px var(--cond);color:var(--acc);letter-spacing:.24em;margin-left:8px}
.clock{font:700 20px/1 var(--cond);margin-left:auto;font-variant-numeric:tabular-nums}.clock small{font:500 13px var(--cond);color:var(--mute);margin-left:6px}
.clock .ph{font:700 13px var(--cond);letter-spacing:.14em;color:var(--acc);margin-right:6px}
.score{font:600 15px var(--cond)}.score .W{color:var(--W)}.score .E{color:var(--E)}
.top-r{display:flex;gap:5px;flex-wrap:wrap}
.btn{font:600 13.5px/1 var(--cond);letter-spacing:.03em;background:#182027;color:var(--ink);border:1px solid var(--line2);padding:7px 10px;border-radius:6px;cursor:pointer;white-space:nowrap}
.btn:hover:not([disabled]){background:#1f2931;border-color:#40505b}
.btn:focus-visible,.card-b:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.btn.pri{background:var(--acc);color:#05252b;border-color:var(--acc)}.btn.on{background:rgba(95,208,224,.14);border-color:var(--acc);color:var(--acc)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--mute)}.btn.sm{padding:5px 8px;font-size:13px}.btn[disabled]{opacity:.35;cursor:not-allowed}
.game{display:grid;grid-template-columns:minmax(0,1fr) 296px;min-height:0}
.view{position:relative;min-height:0;overflow:hidden;background:#000;display:flex;flex-direction:column}
.stage{position:relative;flex:1;min-height:0;overflow:hidden}
#gl,#cv{position:absolute;inset:0;display:block;width:100%;height:100%}#cv{touch-action:none}.stage{background:#07090b}
/* advisor */
.adv{display:flex;gap:12px;align-items:center;padding:5px 12px 6px;background:#10151a;border-bottom:1px solid var(--line2);border-left:4px solid var(--acc);flex:none}
.adv[hidden]{display:none}.adv.acil{border-left-color:var(--bad);background:linear-gradient(90deg,rgba(255,90,74,.1),#10151a 40%)}.adv.firsat{border-left-color:var(--ok)}
.adv .ab{flex:1;min-width:0}.adv .ah{display:flex;align-items:center;gap:8px}
.adv .tg{flex:none;font:700 11px var(--cond);letter-spacing:.09em;text-transform:uppercase;padding:2px 6px;border-radius:4px;background:rgba(95,208,224,.14);color:var(--acc)}
.adv.acil .tg{background:rgba(255,90,74,.16);color:#ff8a7e}.adv.firsat .tg{background:rgba(127,224,160,.14);color:var(--ok)}
.adv h4{font:700 15.5px/1.35 var(--cond);margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.adv p{margin:1px 0 0;font-size:13px;color:#c9d0d3;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.adv p b{color:#fff}.adv .why{color:#98a2a8;font-size:12.5px}.adv .why b{color:var(--ok);font-weight:600}
.adv .acts{flex:none;display:flex;flex-wrap:wrap;gap:5px;justify-content:flex-end;max-width:44%}
.adv .nv{margin-left:auto;display:flex;gap:2px;align-items:center;font:600 12px var(--cond);color:var(--mute)}.adv .nv button{background:none;border:0;color:var(--mute);font:700 16px var(--cond);cursor:pointer;padding:0 5px}
/* hud on stage */
#toasts{position:absolute;top:50px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:min(440px,42%);z-index:4}
.toast{background:rgba(12,15,17,.92);border:1px solid var(--line2);border-left:3px solid var(--acc);border-radius:6px;padding:7px 12px;font:500 14px/1.35 var(--sans);box-shadow:0 6px 20px rgba(0,0,0,.4);transition:opacity .4s}
.toast b{font:700 12px var(--cond);letter-spacing:.08em;color:var(--acc);margin-right:8px;text-transform:uppercase}.toast.E{border-left-color:var(--E)}.toast.E b{color:#ff8a7e}.toast.gold{border-left-color:#e6c35a}
.hint{position:absolute;left:12px;right:12px;bottom:calc(var(--conH,0px) + 10px);font:500 14px/1.35 var(--sans);color:#dfe3e4;text-shadow:0 1px 3px #000,0 0 8px #000;pointer-events:none;z-index:3}.hint b{color:var(--acc)}.hint .err{color:#ff9d90}
#threats{position:absolute;right:12px;top:10px;min-width:250px;background:rgba(12,15,17,.9);border:1px solid #5b2a25;border-left:3px solid var(--bad);border-radius:8px;padding:7px 10px;font:500 13px/1.45 var(--sans);z-index:3;pointer-events:none}
#threats[hidden]{display:none}#threats h5{margin:0 0 3px;font:700 12px var(--cond);letter-spacing:.1em;color:#ff8a7e;text-transform:uppercase;display:flex;justify-content:space-between}
#threats div{display:flex;justify-content:space-between;gap:10px}#threats div b{font:700 14px var(--mono);font-size:12.5px;color:#fff}#threats .hv{color:#ffb1a8}#threats .ig{color:var(--dim)}#threats .kd{font-style:normal;color:#9a7f78;font-size:11.5px}
#wx{position:absolute;left:12px;top:10px;font:600 13px var(--cond);letter-spacing:.06em;color:#cfd6d9;background:rgba(12,15,17,.78);border:1px solid var(--line2);border-radius:6px;padding:4px 9px;z-index:3;pointer-events:none}
/* console */
.con{position:absolute;left:0;right:0;bottom:0;height:var(--conH);display:grid;grid-template-columns:minmax(0,1.32fr) minmax(0,.95fr) minmax(0,1.08fr) 224px;gap:0;background:linear-gradient(#11171c,#0b0f12);border-top:1px solid #2f3a42;z-index:5;box-shadow:0 -10px 30px rgba(0,0,0,.45)}
.con[hidden]{display:none}
.con .col{padding:9px 12px;min-width:0;border-right:1px solid var(--line)}
.con h6{margin:0 0 6px;font:700 11px var(--cond);letter-spacing:.14em;text-transform:uppercase;color:var(--mute);display:flex;gap:8px;align-items:center}
.con h6 .md{margin-left:auto;display:flex;gap:3px}.con h6 .md button{font:700 11px var(--cond);letter-spacing:.1em;padding:3px 7px;border-radius:4px;border:1px solid var(--line2);background:#141a1f;color:var(--mute);cursor:pointer}
.con h6 .md button.on{color:#05252b;background:var(--acc);border-color:var(--acc)}.con h6 .md button.onr{color:#fff;background:#a8322a;border-color:#ff5a4a}
.wsel{display:flex;gap:5px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.wcard{flex:none;width:96px;background:#141a1f;border:1px solid var(--line2);border-radius:6px;padding:4px 5px 5px;cursor:pointer;color:var(--ink);text-align:left;font:inherit;position:relative}
.wcard img{display:block;width:84px;height:28px;object-fit:contain;margin:0 auto 2px}
.wcard b{display:block;font:700 12.5px/1.05 var(--cond);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wcard i{display:block;font:500 10.5px/1.1 var(--cond);font-style:normal;color:var(--dim)}
.wcard .st{position:absolute;right:5px;top:3px;font:700 12px var(--mono);color:var(--ok)}
.wcard.on{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc);background:#11232a}.wcard.off{opacity:.4}
.pkg{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px;min-height:22px}
.pkg span{font:600 12px var(--cond);padding:2px 7px;border-radius:4px;background:#1b2329;border:1px solid var(--line2)}
.pkg span em{font-style:normal;color:var(--acc);margin-left:4px}
.tinfo{font:500 13px/1.4 var(--sans);color:#cfd6d9}.tinfo b{color:#fff;font-weight:600}.tinfo .risk{color:#ff8a7e}.tinfo .ok{color:var(--ok)}
#prof{display:block;width:100%;height:50px;margin-top:4px;background:#0a0d10;border:1px solid var(--line);border-radius:5px}
.row{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.qty{display:flex;align-items:center;gap:2px}.qty button{width:24px;height:24px;border-radius:4px;border:1px solid var(--line2);background:#182027;color:var(--ink);font:700 15px var(--cond);cursor:pointer}.qty b{min-width:26px;text-align:center;font:700 16px var(--mono)}
/* fire control */
.fc{display:flex;align-items:center;justify-content:center;gap:14px;padding:6px 10px;position:relative;background:repeating-linear-gradient(135deg,#0d1114 0 8px,#0f1418 8px 16px)}
.armw{display:flex;flex-direction:column;align-items:center;gap:5px}
.arm{position:relative;width:62px;height:82px;border-radius:7px;background:#1a1f22;border:2px solid #333b40;cursor:pointer;perspective:240px;padding:0;box-shadow:inset 0 2px 6px rgba(0,0,0,.6)}
.arm .tog{position:absolute;left:50%;top:50%;width:14px;height:40px;margin:-20px 0 0 -7px;border-radius:7px;background:linear-gradient(90deg,#aaa,#eee,#999);box-shadow:0 3px 4px rgba(0,0,0,.6);transform-origin:50% 100%;transition:transform .25s;transform:translateY(8px) rotateX(-45deg)}
.arm.open .tog{transform:translateY(-8px) rotateX(45deg)}
.arm .cover{position:absolute;inset:-3px;border-radius:7px;background:repeating-linear-gradient(-45deg,rgba(200,40,30,.92) 0 9px,rgba(25,25,25,.92) 9px 18px);border:2px solid #ff5a4a;transform-origin:50% 0;transition:transform .45s cubic-bezier(.2,1.4,.4,1);box-shadow:0 4px 10px rgba(0,0,0,.6);backface-visibility:hidden}
.arm.open .cover{transform:rotateX(108deg)}
.arm .cover::after{content:"";position:absolute;left:50%;bottom:6px;width:18px;height:6px;margin-left:-9px;border-radius:3px;background:#2a2a2a;border:1px solid #555}
.armw small,.fbw small{font:700 10.5px var(--cond);letter-spacing:.16em;color:var(--mute);text-transform:uppercase}
.armw small.hot{color:#ff8a7e;animation:blink 1s infinite}
.fbw{display:flex;flex-direction:column;align-items:center;gap:5px}
.well{width:112px;height:104px;border-radius:14px;background:linear-gradient(#2b3237,#13181b);border:1px solid #3a444b;box-shadow:inset 0 2px 0 rgba(255,255,255,.06),inset 0 -4px 10px rgba(0,0,0,.65),0 6px 14px rgba(0,0,0,.6);display:grid;place-items:center;padding-bottom:12px;position:relative}
.well::before{content:"";position:absolute;width:98px;height:98px;border-radius:50%;top:4px;left:50%;margin-left:-49px;background:radial-gradient(circle,#06080a 60%,#20272b 72%,#0b0e10 76%);box-shadow:inset 0 3px 6px rgba(0,0,0,.9)}
.fbtn{--p:0;position:relative;z-index:1;width:84px;height:84px;border-radius:50%;border:0;padding:0;cursor:pointer;color:#fff;background:radial-gradient(circle at 50% 34%,#ff7a62,#c32a1c 52%,#7a160d 100%);
 transform:translateY(calc(var(--p) * 12px));box-shadow:0 calc(12px - var(--p) * 11px) 0 #5a110a,0 calc(15px - var(--p) * 12px) calc(12px - var(--p) * 8px) rgba(0,0,0,.75),inset 0 -8px 14px rgba(0,0,0,.45),inset 0 6px 10px rgba(255,255,255,.3);filter:brightness(calc(1 + var(--p) * .45))}
.fbtn:not(.press){transition:transform .14s ease-out,box-shadow .14s ease-out}
.fbtn[disabled]{filter:grayscale(.9) brightness(.45);cursor:not-allowed}
.fbtn.ready{animation:rdy 1.3s infinite}
.fbtn span{position:relative;display:block;font:700 21px/1 var(--cond);letter-spacing:.14em;text-shadow:0 2px 3px rgba(0,0,0,.6)}
.fbtn em{position:relative;display:block;font:600 9.5px var(--cond);letter-spacing:.12em;font-style:normal;opacity:.85;margin-top:3px}
.fbtn.fired{animation:fired .6s}
@keyframes rdy{50%{filter:brightness(1.18) drop-shadow(0 0 12px rgba(255,90,74,.85))}}
@keyframes fired{0%{filter:brightness(3)}100%{filter:none}}
@keyframes blink{50%{opacity:.35}}
.fstat{position:absolute;left:8px;right:8px;bottom:4px;text-align:center;font:600 11.5px var(--mono);color:var(--mute)}
.fstat.hot{color:#ffd27a}
#flash{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 70%,rgba(255,220,160,.85),rgba(255,120,40,.35) 40%,transparent 70%);opacity:0;z-index:6}
#flash.go{animation:fl .55s ease-out}@keyframes fl{0%{opacity:1}100%{opacity:0}}
.view.shake{animation:shk .45s}@keyframes shk{10%{transform:translate(-6px,3px)}25%{transform:translate(5px,-4px)}40%{transform:translate(-4px,-2px)}55%{transform:translate(3px,3px)}70%{transform:translate(-2px,1px)}100%{transform:none}}
/* side */
.side{background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;overflow:auto}
.side>*{flex-shrink:0}
.money{display:flex;justify-content:space-between;align-items:baseline;padding:10px 14px 6px}.money b{font:700 30px/1 var(--cond);font-variant-numeric:tabular-nums}.money small{font:600 14px var(--cond);color:var(--ok)}
.mmwrap{position:relative;margin:0 12px;border:1px solid var(--line2);border-radius:6px;overflow:hidden;background:#050607}#mm{display:block;width:100%;cursor:pointer}
.tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;padding:10px 12px 6px}.tabs .btn{text-align:center;position:relative}
.vsw{display:inline-flex;border:1px solid var(--line2)}.vsw .btn{border:0;border-radius:0 !important;padding:6px 9px}.vsw .btn+.btn{border-left:1px solid var(--line2)}
.tabs .btn .bd{position:absolute;right:-3px;top:-5px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--acc);color:#05252b;font:700 11px/16px var(--cond)}
.tabdesc{padding:0 12px 4px;font:500 12.5px/1.35 var(--sans);color:var(--mute)}
.build{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:4px 12px 8px}
.sect{grid-column:1/-1;display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;margin:8px 0 0;padding-top:6px;border-top:1px solid var(--line);font:600 12px var(--cond);letter-spacing:.07em;text-transform:uppercase;color:var(--dim)}
.build>.sect:first-child{border-top:0;padding-top:0;margin-top:2px}.sect em{font:500 11.5px var(--sans);font-style:normal;letter-spacing:0;text-transform:none;color:#6f7780}
.card-b{position:relative;background:#141a1f;border:1px solid #27313a;border-radius:7px;padding:4px 3px 5px;color:var(--ink);cursor:pointer;text-align:center;font:inherit;overflow:hidden;min-height:84px}
.card-b:hover:not(.off){border-color:#4a5663;background:#1a2229}
.card-b img{display:block;width:64px;height:40px;margin:0 auto;object-fit:contain}
.card-b .nm{display:block;font:600 12.5px/1.05 var(--cond);margin-top:2px;min-height:26px}.card-b .rl{display:block;font:500 10.5px/1.1 var(--cond);color:var(--dim);margin:-1px 0 1px}
.card-b .ct{display:block;font:600 12px var(--cond);color:var(--mute)}.card-b .k{position:absolute;left:4px;top:3px;font:700 12px var(--mono);color:var(--ok)}
.card-b.on{border-color:var(--acc);background:rgba(95,208,224,.12)}.card-b.off{opacity:.42;cursor:not-allowed}
#specpop{position:fixed;width:340px;z-index:40;background:#11171c;border:1px solid var(--line2);border-radius:10px;padding:12px 14px;box-shadow:0 14px 44px rgba(0,0,0,.65);pointer-events:none}
#specpop img{height:96px;object-fit:contain}#specpop h4{font:700 20px var(--cond);margin:0 0 2px;letter-spacing:.02em}#specpop .m{color:var(--mute);font-size:13px}
.selp{margin:4px 12px 12px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);min-height:84px}
.selp h4{font:700 17px var(--cond);margin:0 0 2px}.selp .m{color:var(--mute);font-size:13px;margin-bottom:8px}.selp .acts{display:flex;flex-wrap:wrap;gap:5px}
.selp .bar{height:5px;background:#0b0e11;border-radius:2px;overflow:hidden;margin:4px 0 6px}.selp .bar i{display:block;height:100%;background:var(--ok)}
.selp .bar.mg i{background:var(--acc)}
.spec img{display:block;width:100%;border-radius:5px;background:#0a1a24;margin:4px 0 6px}
.spec dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 10px;margin:0;font-size:12.5px}.spec dt{color:var(--mute)}.spec dd{margin:0;font:600 12.5px var(--mono);color:#e6e9ea}
.spec .w{color:#cdd3d6;font-size:12.5px;margin-top:6px;border-top:1px solid var(--line);padding-top:6px}.spec .w b{color:var(--ok)}
.muted{color:var(--mute)}.warn{color:var(--bad)}
/* overlay */
.overlay{position:fixed;inset:0;background:rgba(6,8,10,.8);backdrop-filter:blur(3px);display:grid;place-items:center;padding:24px 16px;z-index:20;overflow:auto}.overlay[hidden]{display:none}
.card{max-width:760px;width:100%;background:rgba(17,21,25,.97);border:1px solid var(--line2);border-radius:14px;padding:30px 30px 26px}.card.wide{max-width:1060px}
.card h1{font:700 clamp(44px,8vw,80px)/.92 var(--cond);letter-spacing:.06em;margin:0 0 4px}.card h1 small{display:block;font:600 22px var(--cond);letter-spacing:.3em;color:var(--acc);margin-top:6px}
.card h2{font:700 30px/1.1 var(--cond);margin:0 0 10px}.card .lead{font-size:17px;color:#d2d7d9;margin:14px 0 18px;max-width:60ch}.card p{color:var(--mute);margin:0 0 12px}.card p b{color:var(--ink)}
.cta{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.cta .btn{padding:11px 18px;font-size:16px}
.nats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px}@media (max-width:760px){.nats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.nat{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--panel2);border:1px solid var(--line2);border-radius:8px;padding:12px 13px;color:var(--ink);cursor:pointer;font:inherit}
.nat.on{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc);background:#132027}.nat b{font:700 22px/1 var(--cond)}.nat span{font-size:13px;line-height:1.4;color:#c2c9cd}.nat em{font:500 12px/1.35 var(--cond);font-style:normal;color:var(--dim)}
.setrow{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:6px 0}.setrow .lb{font:600 13px var(--cond);letter-spacing:.07em;text-transform:uppercase;color:var(--mute);width:66px}
.howto{display:grid;grid-template-columns:200px minmax(0,1fr);gap:24px}@media (max-width:640px){.howto{grid-template-columns:minmax(0,1fr)}}
.howto nav{display:flex;flex-direction:column;gap:4px}.howto nav .btn{text-align:left}.howto .pg li,.howto .pg p{color:#cfd4d6;font-size:15px}
kbd{font:700 12px var(--mono);background:#232b33;border:1px solid #37414d;border-bottom-width:2px;border-radius:4px;padding:1px 5px;color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:0 0 16px}.stats div{background:#0d1114;border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.stats span{display:block;font:600 12px var(--cond);color:var(--dim);letter-spacing:.05em;text-transform:uppercase}.stats b{font:700 22px var(--cond)}
.kv{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:5px 12px;font-size:14px}.kv span{color:var(--mute)}.kv b{font:600 16px var(--cond)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin:14px 0}.cols h4{font:700 18px var(--cond);margin:0 0 6px}.cols .W h4{color:var(--W)}.cols .E h4{color:var(--E)}
@media (max-width:1500px){header.top .btn{padding:7px 8px}}@media (max-width:1100px){.brand small{display:none}}
@media (max-width:900px){body{overflow:auto}.shell{height:auto}.game{grid-template-columns:minmax(0,1fr)}.view{height:80vh}.con{grid-template-columns:1fr;height:auto;position:relative}}

.sideh{padding:10px 14px 0;font:700 12px var(--cond);letter-spacing:.16em;color:var(--acc)}.sideh em{font:500 12px var(--sans);font-style:normal;letter-spacing:0;color:var(--mute);margin-left:6px}
.note{grid-column:1/-1;font:500 12.5px/1.45 var(--sans);color:#b9c2c6;background:#10161a;border:1px solid var(--line);border-radius:7px;padding:8px 10px}.note b{color:#fff;font-weight:600}

@media (max-width:820px){.ts{grid-template-columns:1fr;align-items:start;overflow:auto}}
.ts h2{margin:0 0 18px;font:600 clamp(34px,5vw,56px)/.95 var(--cond);color:#eef1ee}
.ts .lbl{font:500 11px var(--mono);letter-spacing:.18em;text-transform:uppercase;color:#7f8a8a;margin:0 0 8px}
.ts-nat{display:grid;border-top:1px solid rgba(220,230,226,.14)}
.ts-nat button{display:flex;align-items:baseline;gap:14px;padding:11px 2px;background:none;border:0;border-bottom:1px solid rgba(220,230,226,.14);color:#8c9694;cursor:pointer;font:600 clamp(22px,2.6vw,30px)/1.1 var(--cond);text-align:left;transition:color .15s,padding .15s}
.ts-nat button small{font:500 11px var(--mono);letter-spacing:.14em;color:#5b6565}
.ts-nat button.on{color:#fff;padding-left:10px}.ts-nat button.on small{color:#a9c3c6}.ts-nat button:hover{color:#dfe5e2}
.ts-info{background:rgba(6,8,9,.72);border-top:1px solid rgba(220,230,226,.18);padding:18px 20px 20px;display:grid;gap:16px}
.ts-info p{margin:0;color:#c3cbc9;font-size:14.5px;max-width:52ch}
.ts-sys{display:grid;grid-template-columns:auto minmax(0,1fr);gap:3px 16px;font:500 12px var(--mono)}.ts-sys dt{color:#6f7a79}.ts-sys dd{margin:0;color:#dfe5e2}
.ts-seg{display:flex;flex-wrap:wrap;gap:0;border:1px solid rgba(220,230,226,.2);width:max-content;max-width:100%}
.ts-seg button{background:none;border:0;border-right:1px solid rgba(220,230,226,.2);color:#9aa4a2;padding:8px 12px;font:500 12px var(--mono);letter-spacing:.06em;text-transform:uppercase;cursor:pointer}.ts-seg button:last-child{border-right:0}
.ts-seg button.on{background:#dfe5e2;color:#0a0c0d}.ts-seg button:hover:not(.on){color:#fff}
.ts-note{font-size:12.5px;color:#7f8a8a}
.ts-go{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.ts-go .go{background:#e9ecea;color:#090b0c;border:0;padding:13px 22px;font:600 15px var(--cond);letter-spacing:.08em;text-transform:uppercase;cursor:pointer}.ts-go .go:hover{background:#fff}
.ts-go .bk{background:none;border:0;color:#8c9694;font:500 12px var(--mono);letter-spacing:.14em;text-transform:uppercase;cursor:pointer;padding:12px 6px}.ts-go .bk:hover{color:#fff}
@media (prefers-reduced-motion:reduce){.tt-bg,.tt-sweep{animation:none}}
/* other overlays: quieter panels */
.overlay:not(.ttl) .card{background:rgba(8,10,11,.95);border:0;border-top:1px solid #39434a;padding:30px clamp(20px,4vw,40px)}
.overlay:not(.ttl){background:rgba(4,5,6,.82)}

/* range layers: left rail */
#rng{position:absolute;left:12px;top:46px;z-index:4;width:148px;background:rgba(9,12,14,.86);border:1px solid var(--line2);border-radius:6px;padding:6px 0 8px;font:600 12.5px var(--cond);color:#cfd6d9;user-select:none}
#rng .rh{display:flex;justify-content:space-between;align-items:center;padding:0 10px 5px;font:600 10.5px var(--mono);letter-spacing:.14em;color:var(--mute)}
#rng .rh button{background:none;border:0;color:var(--mute);font:600 10.5px var(--mono);letter-spacing:.1em;cursor:pointer;padding:0}#rng .rh button:hover{color:#fff}
#rng .rl{display:flex;align-items:center;gap:8px;width:100%;background:none;border:0;color:#8d969c;font:600 13px var(--cond);padding:4px 10px;cursor:pointer;text-align:left}
#rng .rl:hover{background:rgba(255,255,255,.04);color:#e6e9ea}
#rng .rl i{flex:none;width:9px;height:9px;border-radius:50%;border:1.5px solid rgb(var(--c));background:transparent}
#rng .rl.on{color:#e6e9ea}#rng .rl.on i{background:rgb(var(--c));box-shadow:0 0 6px rgba(var(--c),.6)}

#rng .alt{border-top:1px solid var(--line);margin-top:5px;padding:7px 10px 0}

#rng .ad{font:500 11px/1.3 var(--sans);color:#8d969c;min-height:28px}
#rng:empty{display:none}#rng.min .rl,#rng.min .alt{display:none}#rng.min{width:auto;padding:5px 0 5px}

const HGW=MW/10,HGH=MH/10;let HGT=null,FOR=null,terrain=null,tctx=null;
function noiseField(r,octs){
  const f=new Float32Array(HGW*HGH);
  for(const [nx,ny,w] of octs){
    const L=[];for(let j=0;j<=ny;j++){L[j]=[];for(let i=0;i<=nx;i++)L[j][i]=r()}
    for(let y=0;y<HGH;y++)for(let x=0;x<HGW;x++){
      const fx=x/HGW*nx,fy=y/HGH*ny,ix=Math.floor(fx),iy=Math.floor(fy),tx=fx-ix,ty=fy-iy,sx=tx*tx*(3-2*tx),sy=ty*ty*(3-2*ty);
      const a=L[iy][ix],b=L[iy][ix+1],c=L[iy+1][ix],d=L[iy+1][ix+1];

    }
  }
  const g=new Float32Array(HGW*HGH);for(let y=0;y<HGH;y++)for(let x=0;x<HGW;x++)g[y*HGW+x]=(f[y*HGW+x]+f[(HGH-1-y)*HGW+(HGW-1-x)])/2;
  let mn=1e9,mx=-1e9;for(const v of g){mn=Math.min(mn,v);mx=Math.max(mx,v)}for(let i=0;i<g.length;i++)g[i]=(g[i]-mn)/(mx-mn);
  return g;
}

    for(const b of [HQPOS.W,HQPOS.E]){const d=hyp(wx-b.x,wy-b.y);if(d<420){const k=1-d/420;HGT[i]=HGT[i]*(1-k*.7)+.35*k*.7;FOR[i]*=1-k}}

  const ip=impactPt(o);if(!ip)return true;
  return G.ents.some(a=>a.alive&&a.side===e.side&&hyp(a.x-ip.x,a.y-ip.y)<(a.r+90));}
function impactPt(o){if(o.kind==='bm'||o.kind==='decoy'||o.kind==='hgv')return o.s>.25?{x:o.x1,y:o.y1}:null;if(o.route)return o.route[o.route.length-1];if(o.kind==='glide'||o.kind==='arm')return{x:o.tx,y:o.ty};return null}
function etaOf(o){if(o.kind==='bm'||o.kind==='decoy'||o.kind==='hgv')return Math.max(0,o.T-(G.time-o.t0));if(o.route){let d=0,px=o.x,py=o.y;for(let i=o.ri;i<o.route.length;i++){d+=hyp(o.route[i].x-px,o.route[i].y-py);px=o.route[i].x;py=o.route[i].y}return d/o.spd}if(o.tx!=null)return hyp(o.tx-o.x,o.ty-o.y)/(o.spd||50);return 99}
function revealLaunch(e){const g=G.ghost[other(e.side)];const p=g.get(e.id);g.set(e.id,{id:e.id,t:e.t,x:e.x,y:e.y,at:G.time,src:'atış izi'});if(other(e.side)==='W'&&!p)G.fx.push({k:'ping',x:e.x,y:e.y,t:0,life:1.4})}
function revealAround(s,x,y,R){for(const e of G.ents)if(e.alive&&e.side!==s&&e.cat==='site'&&hyp(e.x-x,e.y-y)<R){const had=G.ghost[s].has(e.id);G.ghost[s].set(e.id,{id:e.id,t:e.t==='DEC'?'LRAD':e.t,x:e.x,y:e.y,at:G.time,src:'keşif'});if(s==='W'&&!had)G.fx.push({k:'ping',x:e.x,y:e.y,t:0,life:1.4})}}
function intel(){
  for(const s of ['W','E']){const g=G.ghost[s];
    for(const e of G.ents){if(e.side===s||e.cat!=='site')continue;if(!e.alive){g.delete(e.id);continue}
      if(SITE[e.t].emit&&e.emit&&e.mode!=='off'&&e.bt<=0){const p=g.get(e.id);if(!p||G.time-p.at>4){const err=e.t==='RAD'?18:30;g.set(e.id,{id:e.id,t:e.t==='DEC'?'LRAD':e.t,x:(p&&p.src!=='ELINT'?p.x:e.x+gauss()*err),y:(p&&p.src!=='ELINT'?p.y:e.y+gauss()*err),at:G.time,src:p&&p.src!=='ELINT'?p.src:'ELINT'});if(s==='W'&&!p)G.fx.push({k:'ping',x:e.x,y:e.y,t:0,life:1.4})}}}

// ================================================================ launching (shared by player and AI)
const launchersFor=(s,k)=>sites(s,MUN[k].from).filter(e=>e.rl<=0&&e.bt<=0);
function launch(s,k,n,tx,ty,wp,delay=0,share){
  const M=MUN[k];if((G.stock[s][k]||0)<n)return 'Stok yetersiz.';
  const L=(share&&M.from==='DLN'?sites(s,'DLN').filter(e=>e.bt<=0):launchersFor(s,k)).sort((a,b)=>hyp(a.x-tx,a.y-ty)-hyp(b.x-tx,b.y-ty));if(!L.length)return M.from==='TEL'?'Hazır füze rampası yok.':'Hazır İHA rampası yok.';
  let left=n,used=0;
  for(const l of L){if(left<=0)break;const take=M.from==='TEL'?1:Math.min(left,share?12:6);left-=take;used+=take;l.rl=SITE[l.t].rl;l.erect=1;
    later(delay+(M.from==='TEL'?1.1:.25),()=>{if(!l.alive)return;for(let i=0;i<take;i++)later(i*.35,()=>{if(!l.alive)return;spawnMun(s,k,l.x+(M.from==='TEL'?-3.4/M_U:gauss()*.15),l.y+(M.from==='TEL'?.4/M_U:gauss()*.15),tx+(i?gauss()*12:0),ty+(i?gauss()*12:0),wp,l.id);
      sfx(M.kind==='bm'?'ignite':M.kind==='hgv'?'hgvlaunch':M.kind==='cruise'?'cmlaunch':'dronelaunch',l.x,l.y);if(M.from==='TEL'){padBlast(l.x,l.y,1.3);if(s==='W'||hyp(l.x-cam.x,l.y-cam.y)<700/cam.z)shake(.35)}});l.fireT=G.time;setTimeout(()=>{l.erect=0},4000)})}
  G.stock[s][k]-=used;G.score[s].sp+=M.c*used;
  if(s==='E'&&(k==='BM'||k==='HGV'))toast(`Uydu uyarısı: ${natOf('E').n} ${nameOf('E',k)} fırlattı.`,'E');
  return used<n?`${used} adet ateşlendi (rampa yetmedi).`:'';
}
function flightTime(s,k,x0,y0,tx,ty,wp){const M=MUN[k];let d=0,px=x0,py=y0;for(const p of [...(wp||[]),{x:tx,y:ty}]){d+=hyp(p.x-px,p.y-py);px=p.x;py=p.y}
  if(M.kind==='bm')return (12+hyp(tx-x0,ty-y0)/170)/(M.spdK||1);if(M.kind==='hgv')return (9+hyp(tx-x0,ty-y0)/260)/(M.spdK||1);return d/M.spd+(M.from==='TEL'?1.1:.3)}

  const d=hyp(tx-ab.x,ty-ab.y)||1,stand=m==='SEAD'?1600:1200,k=Math.max(0,(d-stand)/d);a.st='sortie';G.cash[s]-=.5;G.score[s].sp+=.5;
  addAir({side:s,kind:'ftr',x:ab.x,y:ab.y,z:.2,base:ab,slot:a.id,m,tx,ty,rx:ab.x+(tx-ab.x)*k,ry:ab.y+(ty-ab.y)*k,spd:110,st:'out',rcs:1,val:80});sfx('jet',ab.x,ab.y);return ''}
function manualEngage(site,o){if(!site||!site.alive)return 'Batarya yok.';const d=SITE[site.t];if(!d.rng||d.ew)return 'Bu sistem önleme yapamaz.';if(site.mag<=0)return 'Şarjör boş.';
  if(!(PK[site.t]||{})[o.kind])return `${nameOf(site.side,site.t)} bu hedefe etkisiz.`;if(o.z<d.a0||o.z>d.a1)return `İrtifa zarfı dışında (${f1(o.z)} km).`;if(hyp(o.x-site.x,o.y-site.y)>rngOf(site.side,site.t))return 'Menzil dışında.';

function aiSpot(s,t){const as=assets(s);const base=t==='RAD'||t==='UPPER'||t==='LRAD'||t==='EW'?HQPOS[s]:as[(Math.random()*as.length)|0]||HQPOS[s];

function aiThink(s,dt){

  if(G.phase==='prep'||A.rebuild){const L=AI_BUILD[G.diff];for(const t of L){const have=sites(s,t).length,want=L.filter(x=>x===t).length;if(have<want&&G.cash[s]>costOf(s,t)+30){const p=aiSpot(s,t);if(p){build(s,t,p.x,p.y);break}}}}
  A.buy-=1.5;if(A.buy<=0){A.buy=8;const want={DRN:Math.round(12*D.sz),CM:Math.round(4*D.sz),BM:G.diff==='easy'?1:3,MALD:G.diff==='easy'?0:3,ARMD:G.diff==='hard'?3:1,HGV:G.diff==='hard'?1:0};
    for(const [k,n] of Object.entries(want))if((G.stock[s][k]||0)<n&&G.cash[s]>costOf(s,k)+40)buy(s,k,1)}

  const pick=()=>{const p=tgts.sort((a,b)=>(ASSET_DEF[b.t].v*(b.hp/b.max)+Math.random()*120)-(ASSET_DEF[a.t].v*(a.hp/a.max)+Math.random()*120))[0];return{x:p.x+gauss()*14,y:p.y+gauss()*14}};

// ================================================================ main update
let senseT=0,intelT=0;
function update(dt){
  if(G.over)return;
  if(G.phase==='prep'){if(!G.freezePrep)G.prepT-=dt;if(G.prepT<=0)startWar()}else G.time+=dt;
  for(let g=0;g<4;g++){const due=G.later.filter(q=>q.at<=G.time);if(!due.length)break;G.later=G.later.filter(q=>q.at>G.time);for(const q of due)q.fn()}
  for(const s of ['W','E']){G.cash[s]+=income(s)*dt;for(const a of G.air4[s])if(a.st==='rearm'){a.t-=dt;if(a.t<=0)a.st='ready'}}
  for(const e of G.ents){if(!e.alive)continue;if(e.bt>0)e.bt-=dt;if(e.rl>0)e.rl-=dt;if(e.hit>0)e.hit-=dt;if(e.flash>0)e.flash-=dt;
    if(e.burn&&Math.random()<dt*3)G.parts.push({k:'smoke',x:e.x+gauss()*e.r*.4,y:e.y+gauss()*e.r*.4,z:.02,vx:G.wx.wind.x,vy:G.wx.wind.y,vz:.06,t:0,life:8,r:5,gr:3,a:.45,dark:1,fire:1})}
  for(const o of G.air)if(o.alive)updAir(o,dt);
  if(G.frame%120===0)G.air=G.air.filter(o=>o.alive);G.frame=(G.frame||0)+1;
  updDebris(dt);
  senseT+=dt;if(senseT>=.15){senseT=0;sense()}
  if(G.phase==='war')engage(dt);
  intelT+=dt;if(intelT>=1){intelT=0;intel();if(G.phase==='war'){G.sat.t-=1;if(G.sat.t<=0){G.sat.t=110;satPass()}}}
  for(const p of G.parts){p.t+=dt;const dr=p.drag?Math.exp(-p.drag*dt):1;p.vx*=dr;p.vy*=dr;p.x+=p.vx*dt;p.y+=p.vy*dt;p.z=Math.max(0,p.z+(p.vz||0)*dt);if(p.gr)p.r+=p.gr*dt}
  G.parts=G.parts.filter(p=>p.t<p.life);if(G.parts.length>2200)G.parts.splice(0,G.parts.length-2200);
  for(const f of G.fx)f.t+=dt;G.fx=G.fx.filter(f=>f.t<f.life);
  updWeather(dt);
  if(!G.aiOff)aiThink('E',dt);if(G.autoW)aiThink2W(dt);
  if(G.time>=GAME_T&&!G.over){G.over=true;const n=s=>G.score[s].dmg-G.score[s].sp*.25;G.winner=n('W')>n('E')?'W':n('E')>n('W')?'E':null}
  if(G.over)setTimeout(showEnd,1400);
}

function toW(e){const r=cv.getBoundingClientRect();const sx=e.clientX-r.left,sy=e.clientY-r.top;return{x:wX(sx),y:wY(sy),sx,sy}}
function pickTrack(w,R=34){let best=null,bd=1e9;for(const o of G.air){if(!o.alive||o.kind==='icp'||(o.side==='E'&&!G.trk.W.has(o.id)))continue;const sx=sX(o.x),sy=sY(o.y-LIFT(o.z));const d=hyp(sx-w.sx,sy-w.sy);if(d<R&&d<bd){bd=d;best=o}}return best}
function pickEnt(w){let best=null,bd=1e9;for(const e of G.ents){if(!e.alive&&!e.ruin)continue;if(e.side==='E'&&e.cat==='site'&&!G.ghost.W.has(e.id))continue;const r=Math.max(vr(e),px(16))+px(4);const d=hyp(e.x-w.x,e.y-w.y);if(d<r&&d<bd){bd=d;best=e}}return best}
function tgtLabel(x,y){const e=G.ents.filter(e=>e.alive&&e.side==='E'&&(e.cat==='asset'||G.ghost.W.has(e.id))).sort((a,b)=>hyp(a.x-x,a.y-y)-hyp(b.x-x,b.y-y))[0];if(e&&hyp(e.x-x,e.y-y)<e.r+40)return e.cat==='asset'?e.nm:nameOf('E',e.t);return `${(x/KMU)|0}/${(y/KMU)|0} km noktası`}

const HOWTO=[
 ['Oyunun mantığı','<p>İki ülke karşı karşıya. İki tarafın da şehirleri, rafinerisi, santrali, hava üssü ve komuta merkezi var. <b>Para bu tesislerden gelir</b>; hasar alan tesis daha az kazandırır.</p><p>Yaptığın iki iş var:</p><ul><li><b>Savunmak</b>: radar ve hava savunma bataryaları kurarsın. Bataryalar menzile giren tehdidi kendisi vurur.</li><li><b>Vurmak</b>: rampa kurar, atış konsolundan rakibin tesislerine füze ve İHA atarsın.</li></ul><p><b>Kazanmak</b>: 15 dakika sonunda rakibe daha çok hasar verdiren kazanır. Komuta merkezi yıkılan hemen kaybeder.</p><p>Başta 2 dakikalık hazırlık var: $900M bütçeyle kurarsın, kimse ateş etmez.</p>'],

 ['Silahlar ve para','<ul><li>Füzeyi ayrıca satın almazsın: ateşlediğin anda fiyatı kasandan düşer.</li><li>Her <b>füze rampası</b> bir füze atar, sonra dolum yapar. 3 rampa = aynı anda 3 füze.</li><li><b>İHA rampası</b> bir seferde 6 İHA uçurur.</li><li><b>Hava üssü</b> 4 uçakla SEAD (radar avı) ve süzülen bomba görevi yapar.</li><li><b>Balistik</b>: bulutların üstüne çıkar, dik iner; onu yalnız uzun menzil ve üst katman savunma durdurur. <b>Seyir</b>: 50 m\'den gelir, radar geç görür. <b>Hipersonik</b>: pahalı, durdurması en zor. <b>Kamikaze İHA</b>: ucuz ve yavaş; rakibin pahalı önleyicilerini tüketir.</li></ul>'],

function frame(now){const dt=Math.min(.05,(now-lastT)/1000);lastT=now;
  if(G&&!G.over&&!G.paused&&ov.hidden)for(let i=0;i<G.speed;i++)update(dt);
  if(G){const pan=(keys.arrowright?1:0)-(keys.arrowleft?1:0),panY=(keys.arrowdown?1:0)-(keys.arrowup?1:0);let ex=0,ey=0;if(edge&&ov.hidden&&!mDown){if(edge.x<10)ex=-1;if(edge.y<10)ey=-1;else if(edge.y>CH-10&&conEl.hidden)ey=1;if(ex||ey)edgeT+=dt;else edgeT=0;if(edgeT<.35)ex=ey=0}
