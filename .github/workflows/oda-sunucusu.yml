# Deploys the room server (server/) to Cloudflare Workers whenever it changes.
# Needs two repository secrets, added by the owner in GitHub → Settings → Secrets and variables → Actions:
#   CLOUDFLARE_API_TOKEN  (Cloudflare → My Profile → API Tokens → "Edit Cloudflare Workers" template)
#   CLOUDFLARE_ACCOUNT_ID (Cloudflare → Workers & Pages → right-hand column "Account ID")
name: Oda sunucusu
on:
  push:
    branches: [main]
    paths: ['server/**', '.github/workflows/oda-sunucusu.yml']
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
